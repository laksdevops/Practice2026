apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-deploy
  labels: 
    app: vote
spec:
  replicas: 1
  selector:
    matchLabels:
     app: vote 
  template:
    metadata:
      name: vote-pod
      labels: 
        app: vote
    spec:
      containers:
        - name: vote-container
          image: dockersamples/examplevotingapp_vote
          ports:
            - containerPort: 80
              name: vote-http
  
  


