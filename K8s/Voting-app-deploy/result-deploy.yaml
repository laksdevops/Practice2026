apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-deploy
  labels: 
    app: result
spec:
  replicas: 1
  selector:
    matchLabels:
     app: result 
  template:
    metadata:
      name: result-pod
      labels: 
        app: result
    spec:
      containers:
        - name: vote-container
          image: dockersamples/examplevotingapp_result
          ports:
            - containerPort: 80
              name: result-http
  
  



