apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deploy
  labels: 
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
     app: db
  template:
    metadata:
      name: db-pod
      labels: 
        app: db
    spec:
      containers:
        - name: db-container
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD 
              value: postgres
          ports:
            - containerPort: 5432
              name: postgres-port
     